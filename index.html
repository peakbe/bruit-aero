<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Aero & Radar - EBLG</title>

  <!-- Style Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    body { font-family: sans-serif; margin: 20px; }
    #map { height: 500px; width: 100%; border-radius: 8px; margin-bottom: 20px; }
    .tables-container { display: flex; gap: 20px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #f4f4f4; }
    .badge { background: #e0e0e0; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>

  <h1>Tableau de bord - Aéroport de Liège (EBLG)</h1>

  <!-- Météo -->
  <div>
    Température : <span id="temp-value">--°C</span> | 
    METAR : <code id="metar-raw">Chargement...</code>
  </div>

  <br />

  <!-- Carte Radar -->
  <div id="map"></div>

  <!-- Tableaux des vols -->
  <div class="tables-container">
    <div>
      <h3>Départs</h3>
      <table>
        <thead>
          <tr><th>Vol</th><th>Destination</th><th>Heure</th><th>Statut</th></tr>
        </thead>
        <tbody id="departures-list"></tbody>
      </table>
    </div>

    <div>
      <h3>Arrivées</h3>
      <table>
        <thead>
          <tr><th>Vol</th><th>Origine</th><th>Heure</th><th>Statut</th></tr>
        </thead>
        <tbody id="arrivals-list"></tbody>
      </table>
    </div>
  </div>

  <!-- Script Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Votre logique JS (chargée UNE SEULE FOIS ici) -->
  <script src="app.js"></script>
</body>
</html>
